<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --primary: #FFAA0F;
            --primary-dark: #D98E00;
            --bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
            --border: #CBD5E1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 18px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-size: 1.6rem;
            color: #0F172A;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        .badge {
            background: var(--primary);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .search-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-card label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 400px) {
            .input-group {
                flex-direction: row;
            }
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.35rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            letter-spacing: 2px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 14px 22px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }

        @media (min-width: 400px) {
            button {
                width: auto;
            }
        }

        button:hover {
            background: var(--primary-dark);
        }

        .result-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            min-height: 250px;
        }

        .result-card h2 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.95rem;
        }

        #result-content {
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .spinner {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <img src="logo.png" alt="Logo">
                <div class="brand-text">
                    <h1>AutoCheck</h1>
                    <p>Consulta en Tiempo Real</p>
                </div>
            </div>
            <span class="badge">PRO</span>
        </div>

        <div class="search-card">
            <label for="patente">Dominio / Patente a Consultar</label>
            <div class="input-group">
                <input type="text" id="patente" placeholder="" maxlength="8" autofocus autocomplete="off">
                <button onclick="consultar()">CONSULTAR</button>
            </div>
        </div>

        <div class="result-card">
            <h2>Información Registral Extraída</h2>
            <div id="spinner" class="spinner"></div>
            <div id="result-content">
                <p class="placeholder-text">Ingrese la patente y presione CONSULTAR para iniciar.</p>
            </div>
        </div>
    </div>

    <script>
        function renderValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                return '<pre style="background:#f8fafc; padding:8px; border-radius:6px; font-size:0.85rem; overflow-x:auto;">' + JSON.stringify(val, null, 2) + '</pre>';
            }
            return String(val);
        }

        async function consultar() {
            const patenteInput = document.getElementById('patente');
            const patente = patenteInput.value.trim();
            const resultContent = document.getElementById('result-content');
            const spinner = document.getElementById('spinner');

            if (!patente) {
                alert('Por favor ingrese una patente válida.');
                return;
            }

            resultContent.innerHTML = '';
            spinner.style.display = 'block';

            try {
                const response = await fetch(`https://autocheck-nssj.onrender.com/consultar?dominio=${encodeURIComponent(patente)}`);
                const data = await response.json();
                
                spinner.style.display = 'none';

                if (response.ok) {
                    if (data.datos && typeof data.datos === 'object') {
                        let html = '<ul style="list-style: none; padding: 0;">';
                        for (const [k, v] of Object.entries(data.datos)) {
                            html += `<li style="padding: 8px 0; border-bottom: 1px solid #f1f5f9;"><strong>${k}:</strong> ${renderValue(v)}</li>`;
                        }
                        html += '</ul>';
                        resultContent.innerHTML = html;
                    } else if (data.mensaje) {
                        resultContent.innerHTML = `<p style="color: #d97706; font-weight: 600;">${renderValue(data.mensaje)}</p>`;
                    } else {
                        resultContent.innerHTML = `<pre style="background:#f8fafc; padding:10px; border-radius:6px; font-size:0.85rem; overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`;
                    }
                } else {
                    let errMessage = 'Ocurrió un error al consultar.';
                    if (data.detail) {
                        errMessage = typeof data.detail === 'object' ? JSON.stringify(data.detail) : data.detail;
                    }
                    resultContent.innerHTML = `<p style="color: #dc2626; font-weight: 600;">Error: ${errMessage}</p>`;
                }
            } catch (err) {
                spinner.style.display = 'none';
                resultContent.innerHTML = `<p style="color: #dc2626; font-weight: 600;">Error de conexión con el servidor.</p>`;
            }
        }
    </script>
</body>
</html>

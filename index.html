<script>
        function renderValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                return '<pre style="background:#f8fafc; padding:8px; border-radius:6px; font-size:0.85rem; overflow-x:auto;">' + JSON.stringify(val, null, 2) + '</pre>';
            }
            return String(val);
        }

        async function consultar() {
            const patenteInput = document.getElementById('patente');
            const patente = patenteInput.value.trim();
            const resultContent = document.getElementById('result-content');
            const spinner = document.getElementById('spinner');

            if (!patente) {
                alert('Por favor ingrese una patente válida.');
                return;
            }

            resultContent.innerHTML = '';
            spinner.style.display = 'block';

            try {
                // Se envía "dominio" en lugar de "patente"
                const response = await fetch(`https://autocheck-nssj.onrender.com/consultar?dominio=${encodeURIComponent(patente)}`);
                const data = await response.json();
                
                spinner.style.display = 'none';

                if (response.ok) {
                    if (data.datos && typeof data.datos === 'object') {
                        let html = '<ul style="list-style: none; padding: 0;">';
                        for (const [k, v] of Object.entries(data.datos)) {
                            html += `<li style="padding: 8px 0; border-bottom: 1px solid #f1f5f9;"><strong>${k}:</strong> ${renderValue(v)}</li>`;
                        }
                        html += '</ul>';
                        resultContent.innerHTML = html;
                    } else if (data.mensaje) {
                        resultContent.innerHTML = `<p style="color: #d97706; font-weight: 600;">${renderValue(data.mensaje)}</p>`;
                    } else {
                        resultContent.innerHTML = `<pre style="background:#f8fafc; padding:10px; border-radius:6px; font-size:0.85rem; overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`;
                    }
                } else {
                    let errMessage = 'Ocurrió un error al consultar.';
                    if (data.detail) {
                        errMessage = typeof data.detail === 'object' ? JSON.stringify(data.detail) : data.detail;
                    }
                    resultContent.innerHTML = `<p style="color: #dc2626; font-weight: 600;">Error: ${errMessage}</p>`;
                }
            } catch (err) {
                spinner.style.display = 'none';
                resultContent.innerHTML = `<p style="color: #dc2626; font-weight: 600;">Error de conexión con el servidor.</p>`;
            }
        }
    </script>
